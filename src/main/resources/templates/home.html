<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Railway + Spring Boot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f2f5f9;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            max-width: 560px;
            text-align: center;
        }
        h1 {
            margin-top: 0;
            color: #1f2937;
        }
        p {
            color: #334155;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
<div class="card">
    <h1 th:text="${title}">Railway + Spring Boot</h1>
    <p th:text="${message}">Controller-ът работи и връща view.</p>
</div>
</body>
</html>
